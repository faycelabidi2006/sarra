name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Locate and verify project
        run: |
          SETTINGS=$(find . -maxdepth 3 -name settings.gradle.kts -not -path "./.git/*" | head -1)
          if [ -z "$SETTINGS" ]; then echo "::error::settings.gradle.kts not found"; find . -maxdepth 3 -not -path "./.git/*" | head -60; exit 1; fi
          DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          for f in build.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml; do
            [ -f "$DIR/$f" ] || { echo "::error::Missing file in repo: $DIR/$f"; exit 1; }
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK 34 (preinstalled SDK on the runner)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Show APK location
        run: |
          find . -name "*.apk" -exec ls -la {} \;
          APK=$(find . -name "app-debug.apk" | head -1)
          [ -n "$APK" ] || { echo "::error::APK was not produced"; exit 1; }
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: FamilyTv-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FamilyTv build ${{ github.run_number }}
          files: ${{ env.APK_PATH }}
